    <text x="1490" y="90" text-anchor="end">SAMPLE — REPLACE ME</text>
  </g>
  <!-- four unit squares, 300 wide, 60 apart -->
  <g fill="none" stroke="#eef3f4" stroke-opacity="0.22" stroke-width="1">
    <rect x="110" y="330" width="300" height="300"/>
    <rect x="470" y="330" width="300" height="300"/>
    <rect x="830" y="330" width="300" height="300"/>
    <rect x="1190" y="330" width="300" height="300"/>
  </g>
  <g fill="none" stroke="#eef3f4" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 8">
    <path d="M470 630 770 330M830 630 1130 330M1190 630 1490 330"/>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M110 630 410 330" stroke="#eef3f4"/>
    <path d="M470 630C569 330 674 330 770 330" stroke="#eef3f4"/>
    <path d="M830 630C878 330 920 330 1130 330" stroke="#2ad2ee"/>
    <path d="M1190 630C1292 162 1382 330 1490 330" stroke="#eef3f4"/>
  </g>
  <!-- control handles of the highlighted curve -->
