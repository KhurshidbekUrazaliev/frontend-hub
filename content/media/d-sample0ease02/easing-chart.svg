<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="1600" height="1000" fill="#05080a"/>
