    <rect x="872" y="324" width="12" height="12"/>
    <rect x="914" y="324" width="12" height="12"/>
  </g>
  <g font-family="'Archivo', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" fill="#eef3f4">
    <text x="110" y="712">LINEAR</text>
    <text x="470" y="712">CUBIC OUT</text>
    <text x="830" y="712" fill="#2ad2ee">EXPO OUT</text>
    <text x="1190" y="712">BACK OUT</text>
  </g>
  <g font-size="15" letter-spacing="1.2" fill="#7b8a91">
    <text x="110" y="748">0, 0, 1, 1</text>
    <text x="470" y="748">0.33, 1, 0.68, 1</text>
    <text x="830" y="748">0.16, 1, 0.3, 1</text>
